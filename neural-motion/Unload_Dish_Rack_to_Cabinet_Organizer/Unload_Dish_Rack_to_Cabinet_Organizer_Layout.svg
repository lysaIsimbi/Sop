<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="860" fill="#ffffff"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#1f2937">Unload a Dish Rack into a Cabinet Organizer</text>
  <text x="40" y="76" font-size="16" fill="#4b5563">Workspace layout, top down view. Right arm owns the rack, the towel, and the mat. Left arm owns the organizer. Every item is handed arm to arm over the mat.</text>

  <!-- tabletop -->
  <rect x="40" y="100" width="1320" height="650" rx="10" fill="#fbfaf8" stroke="#d6d0c6" stroke-width="2"/>
  <text x="1348" y="122" font-size="13" fill="#9ca3af" text-anchor="end">TABLETOP</text>

  <!-- ===== ORGANIZER ===== -->
  <rect x="76" y="150" width="360" height="576" rx="8" fill="#eef2f7" stroke="#5b789c" stroke-width="2.5"/>
  <text x="256" y="176" font-size="16" font-weight="700" fill="#2f4a6d" text-anchor="middle">CABINET ORGANIZER</text>
  <text x="256" y="196" font-size="12.5" fill="#5f7591" text-anchor="middle">against the left edge, left arm only</text>

  <!-- ===== UPPER SHELF ===== -->
  <rect x="94" y="208" width="324" height="254" rx="6" fill="#ffffff" stroke="#5b789c" stroke-width="2"/>
  <text x="256" y="232" font-size="13.5" font-weight="700" fill="#2f4a6d" text-anchor="middle">UPPER SHELF, open and undivided</text>

  <!-- plate stack -->
  <circle cx="178" cy="336" r="56" fill="#f2f6fb" stroke="#3c5f8a" stroke-width="2"/>
  <circle cx="178" cy="336" r="37" fill="#e2ecf7" stroke="#3c5f8a" stroke-width="2"/>
  <text x="178" y="332" font-size="11.5" font-weight="700" fill="#2f4a6d" text-anchor="middle">SMALL</text>
  <text x="178" y="380" font-size="11.5" font-weight="700" fill="#2f4a6d" text-anchor="middle">LARGE</text>
  <text x="178" y="424" font-size="12.5" font-weight="700" fill="#2f4a6d" text-anchor="middle">PLATE STACK</text>
  <text x="178" y="441" font-size="11" fill="#5f7591" text-anchor="middle">face up, large below</text>

  <!-- nested bowls -->
  <circle cx="334" cy="336" r="52" fill="#f2f6fb" stroke="#3c5f8a" stroke-width="2"/>
  <circle cx="334" cy="336" r="33" fill="#e2ecf7" stroke="#3c5f8a" stroke-width="2"/>
  <text x="334" y="340" font-size="11.5" font-weight="700" fill="#2f4a6d" text-anchor="middle">BOWL 2</text>
  <text x="334" y="378" font-size="11.5" font-weight="700" fill="#2f4a6d" text-anchor="middle">BOWL 1</text>
  <text x="334" y="424" font-size="12.5" font-weight="700" fill="#2f4a6d" text-anchor="middle">NESTED BOWLS</text>
  <text x="334" y="441" font-size="11" fill="#5f7591" text-anchor="middle">clear of the plates</text>

  <!-- ===== CUP HOOKS on the front edge of the upper shelf ===== -->
  <line x1="94" y1="466" x2="418" y2="466" stroke="#3c5f8a" stroke-width="4"/>
  <line x1="176" y1="466" x2="176" y2="482" stroke="#3c5f8a" stroke-width="2.5"/>
  <circle cx="176" cy="482" r="4.5" fill="#3c5f8a"/>
  <circle cx="176" cy="510" r="27" fill="#f6fbff" stroke="#3c5f8a" stroke-width="2"/>
  <path d="M203,502 a13,13 0 0 1 0,17" fill="none" stroke="#3c5f8a" stroke-width="2.5"/>
  <text x="176" y="514" font-size="12" font-weight="700" fill="#2f4a6d" text-anchor="middle">CUP</text>
  <line x1="336" y1="466" x2="336" y2="482" stroke="#3c5f8a" stroke-width="2.5"/>
  <circle cx="336" cy="482" r="4.5" fill="#3c5f8a"/>
  <circle cx="336" cy="510" r="27" fill="#f6fbff" stroke="#3c5f8a" stroke-width="2"/>
  <path d="M363,502 a13,13 0 0 1 0,17" fill="none" stroke="#3c5f8a" stroke-width="2.5"/>
  <text x="336" y="514" font-size="12" font-weight="700" fill="#2f4a6d" text-anchor="middle">CUP</text>
  <text x="256" y="551" font-size="12" font-weight="700" fill="#2f4a6d" text-anchor="middle">CUP HOOKS, front edge of the upper shelf</text>
  <text x="256" y="567" font-size="11" fill="#5f7591" text-anchor="middle">one cup per hook, rim down, hanging free in the gap</text>

  <!-- ===== LOWER SHELF ===== -->
  <rect x="94" y="580" width="324" height="130" rx="6" fill="#ffffff" stroke="#5b789c" stroke-width="2"/>
  <text x="256" y="600" font-size="13.5" font-weight="700" fill="#2f4a6d" text-anchor="middle">LOWER SHELF, cutlery</text>
  <rect x="104" y="608" width="304" height="62" rx="5" fill="#f7fafd" stroke="#8aa2c0" stroke-width="1.5"/>
  <line x1="205" y1="608" x2="205" y2="670" stroke="#8aa2c0" stroke-width="1.5"/>
  <line x1="306" y1="608" x2="306" y2="670" stroke="#8aa2c0" stroke-width="1.5"/>
  <!-- fork -->
  <line x1="154" y1="618" x2="154" y2="652" stroke="#3c5f8a" stroke-width="3"/>
  <line x1="147" y1="618" x2="147" y2="630" stroke="#3c5f8a" stroke-width="2"/>
  <line x1="161" y1="618" x2="161" y2="630" stroke="#3c5f8a" stroke-width="2"/>
  <!-- knife -->
  <line x1="255" y1="618" x2="255" y2="652" stroke="#3c5f8a" stroke-width="3"/>
  <path d="M248,618 q13,8 7,20" fill="none" stroke="#3c5f8a" stroke-width="2"/>
  <!-- spoon -->
  <line x1="357" y1="626" x2="357" y2="652" stroke="#3c5f8a" stroke-width="3"/>
  <ellipse cx="357" cy="620" rx="8" ry="11" fill="none" stroke="#3c5f8a" stroke-width="2"/>
  <text x="256" y="686" font-size="10.5" fill="#5f7591" text-anchor="middle">one each, lying flat</text>
  <text x="256" y="700" font-size="10.5" fill="#5f7591" text-anchor="middle">any compartment, either way round</text>

  <!-- ===== DRYING MAT AND HANDOFF POINT ===== -->
  <rect x="536" y="330" width="272" height="216" rx="10" fill="#f7f3e8" stroke="#b08b4f" stroke-width="2.5"/>
  <rect x="552" y="342" width="240" height="96" rx="8" fill="#fffdf5" stroke="#b08b4f" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="672" y="365" font-size="14" font-weight="700" fill="#7a5a20" text-anchor="middle">HANDOFF POINT</text>
  <text x="672" y="384" font-size="11.5" fill="#8a6b31" text-anchor="middle">in the air over the mat</text>
  <text x="672" y="401" font-size="11.5" fill="#8a6b31" text-anchor="middle">every item changes arms here</text>
  <text x="672" y="422" font-size="11.5" font-weight="700" fill="#8a6b31" text-anchor="middle">cups and cutlery wiped here</text>
  <text x="672" y="472" font-size="16" font-weight="700" fill="#7a5a20" text-anchor="middle">DRYING MAT</text>
  <text x="672" y="493" font-size="12.5" fill="#8a6b31" text-anchor="middle">plates and bowls only</text>
  <text x="672" y="511" font-size="12.5" fill="#8a6b31" text-anchor="middle">wiped here, then handed over</text>
  <text x="672" y="532" font-size="11.5" fill="#a08355" text-anchor="middle">cups and cutlery never touch it</text>

  <!-- ===== TOWEL HOME ===== -->
  <rect x="856" y="366" width="130" height="118" rx="8" fill="#f9e9e0" stroke="#c2714b" stroke-width="2.5"/>
  <rect x="878" y="392" width="86" height="66" rx="4" fill="#ffffff" stroke="#c2714b" stroke-width="1.5"/>
  <line x1="878" y1="414" x2="964" y2="414" stroke="#e0b49c" stroke-width="1.5"/>
  <line x1="878" y1="436" x2="964" y2="436" stroke="#e0b49c" stroke-width="1.5"/>
  <text x="921" y="506" font-size="13" font-weight="700" fill="#8f4a2a" text-anchor="middle">TOWEL HOME</text>
  <text x="921" y="524" font-size="11" fill="#a8674a" text-anchor="middle">right arm only, 2 passes</text>

  <!-- ===== DISH RACK ===== -->
  <rect x="1024" y="150" width="300" height="560" rx="8" fill="#eef7f1" stroke="#4f8a68" stroke-width="2.5"/>
  <text x="1174" y="176" font-size="16" font-weight="700" fill="#2c5a41" text-anchor="middle">DISH RACK</text>
  <text x="1174" y="196" font-size="12.5" fill="#54786a" text-anchor="middle">against the right edge, right arm only</text>

  <!-- plate slots -->
  <rect x="1042" y="212" width="264" height="150" rx="6" fill="#ffffff" stroke="#8fbfa4" stroke-width="1.5"/>
  <line x1="1074" y1="232" x2="1074" y2="322" stroke="#cfe4d8" stroke-width="2"/>
  <line x1="1110" y1="232" x2="1110" y2="322" stroke="#cfe4d8" stroke-width="2"/>
  <line x1="1146" y1="232" x2="1146" y2="322" stroke="#cfe4d8" stroke-width="2"/>
  <line x1="1182" y1="232" x2="1182" y2="322" stroke="#cfe4d8" stroke-width="2"/>
  <line x1="1218" y1="232" x2="1218" y2="322" stroke="#cfe4d8" stroke-width="2"/>
  <line x1="1254" y1="232" x2="1254" y2="322" stroke="#cfe4d8" stroke-width="2"/>
  <rect x="1104" y="232" width="12" height="90" rx="3" fill="#dff0e6" stroke="#2c5a41" stroke-width="2"/>
  <rect x="1212" y="248" width="12" height="74" rx="3" fill="#dff0e6" stroke="#2c5a41" stroke-width="2"/>
  <text x="1110" y="344" font-size="11.5" font-weight="700" fill="#2c5a41" text-anchor="middle">LARGE</text>
  <text x="1218" y="344" font-size="11.5" font-weight="700" fill="#2c5a41" text-anchor="middle">SMALL</text>
  <text x="1174" y="384" font-size="12.5" font-weight="700" fill="#2c5a41" text-anchor="middle">PLATE SLOTS, upright</text>

  <!-- shelf -->
  <rect x="1042" y="398" width="264" height="150" rx="6" fill="#ffffff" stroke="#8fbfa4" stroke-width="1.5"/>
  <circle cx="1098" cy="446" r="30" fill="#dff0e6" stroke="#2c5a41" stroke-width="2"/>
  <text x="1098" y="450" font-size="11" font-weight="700" fill="#2c5a41" text-anchor="middle">BOWL</text>
  <circle cx="1098" cy="514" r="26" fill="#dff0e6" stroke="#2c5a41" stroke-width="2"/>
  <text x="1098" y="518" font-size="11" font-weight="700" fill="#2c5a41" text-anchor="middle">BOWL</text>
  <circle cx="1236" cy="446" r="26" fill="#f6fbff" stroke="#2c5a41" stroke-width="2"/>
  <path d="M1262,438 a12,12 0 0 1 0,16" fill="none" stroke="#2c5a41" stroke-width="2.5"/>
  <text x="1236" y="450" font-size="11" font-weight="700" fill="#2c5a41" text-anchor="middle">CUP</text>
  <circle cx="1236" cy="514" r="26" fill="#f6fbff" stroke="#2c5a41" stroke-width="2"/>
  <path d="M1262,506 a12,12 0 0 1 0,16" fill="none" stroke="#2c5a41" stroke-width="2.5"/>
  <text x="1236" y="518" font-size="11" font-weight="700" fill="#2c5a41" text-anchor="middle">CUP</text>
  <text x="1174" y="570" font-size="12.5" font-weight="700" fill="#2c5a41" text-anchor="middle">SHELF, bowls and cups inverted</text>

  <!-- basket -->
  <rect x="1042" y="584" width="264" height="106" rx="6" fill="#ffffff" stroke="#8fbfa4" stroke-width="1.5"/>
  <line x1="1128" y1="606" x2="1128" y2="662" stroke="#2c5a41" stroke-width="3"/>
  <line x1="1121" y1="606" x2="1121" y2="620" stroke="#2c5a41" stroke-width="2"/>
  <line x1="1135" y1="606" x2="1135" y2="620" stroke="#2c5a41" stroke-width="2"/>
  <line x1="1174" y1="606" x2="1174" y2="662" stroke="#2c5a41" stroke-width="3"/>
  <path d="M1167,606 q13,9 7,24" fill="none" stroke="#2c5a41" stroke-width="2"/>
  <line x1="1220" y1="618" x2="1220" y2="662" stroke="#2c5a41" stroke-width="3"/>
  <ellipse cx="1220" cy="612" rx="8" ry="12" fill="none" stroke="#2c5a41" stroke-width="2"/>
  <text x="1174" y="682" font-size="12.5" font-weight="700" fill="#2c5a41" text-anchor="middle">BASKET, handle up</text>

  <!-- ===== FLOW ARROWS ===== -->
  <path d="M1016,286 C 950,236 866,246 800,296" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="890" y="228" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">1b. right arm, cups and cutlery</text>
  <text x="890" y="246" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">rack straight to the handoff</text>

  <path d="M1016,528 C 950,584 872,566 818,512" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="898" y="606" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">1a. right arm, plates and bowls</text>
  <text x="898" y="624" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">rack to the mat</text>

  <path d="M524,386 C 486,386 470,340 444,326" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="486" y="452" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">2. left arm,</text>
  <text x="486" y="470" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">handoff point</text>
  <text x="486" y="488" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">to organizer</text>

  <!-- footer -->
  <text x="40" y="766" font-size="13.5" font-weight="700" fill="#374151">Unload order, fixed by type not position:</text>
  <text x="366" y="766" font-size="13.5" fill="#374151">plates (large, small), then bowls, then cutlery (fork, knife, spoon), then cups.</text>
  <text x="40" y="790" font-size="13.5" font-weight="700" fill="#374151">Where the wipe happens:</text>
  <text x="366" y="790" font-size="13.5" fill="#374151">plates and bowls are wiped lying on the mat; cups and cutlery are wiped in the air, held up by the left gripper.</text>
  <text x="40" y="814" font-size="13.5" font-weight="700" fill="#374151">Bowls and cups:</text>
  <text x="366" y="814" font-size="13.5" fill="#374151">take the one nearer the front of the rack first. Every item is passed right gripper to left gripper at the handoff point.</text>
  <text x="40" y="838" font-size="12.5" fill="#6b7280">Front edge of the tabletop is the bottom of this drawing, where the operator sits. The lower shelf sits under the upper shelf and is drawn in front of it.</text>
</svg>
